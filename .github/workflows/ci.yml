name: CI

on:
  push:
    paths-ignore:
      - "v1/**"
      - "v2/**"
      - "docs/**"
      - "bench/**"
  pull_request:
    paths-ignore:
      - "v1/**"
      - "v2/**"
      - "docs/**"
      - "bench/**"
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 代码检查
        run: python -m ruff check .
      - name: 单元测试
        run: python -m pytest tests -q
        env:
          PYTHONIOENCODING: utf-8
