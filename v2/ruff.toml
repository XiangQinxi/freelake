# Ruff 配置（只约束 v2/，v1/ 是历史参考代码不参与检查）
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",  # 行宽由 formatter 管，代码里的长中文注释不受限
]

[lint.per-file-ignores]
# api.py 是门面：import 进来就是为了 re-export
"api.py" = ["F401"]
# 测试里用下划线开头的私有函数/模型是刻意的
"tests/*" = ["F401", "SLF001"]
